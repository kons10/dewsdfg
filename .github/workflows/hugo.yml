name: 📝Sync Latest Gist to Hugo

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run script
        run: python scripts/update_gist.py

      - name: Commit and Push
        id: push_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dirty/content/post/*.md
          if ! git diff --cached --exit-code; then
            git commit -m "chore: add latest gist post"
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "変更なし"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Hugo Deploy
        if: steps.push_step.outputs.pushed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'hugo.yml',
              ref: 'main'
            })
