name: 📝Sync Latest Gist to Hugo

on:
  schedule:
    - cron: '0 * * * *' # 1時間に1回実行
  workflow_dispatch:      # 手動でも実行できるようにする

permissions:
  contents: write # リポジトリにPushするために必要だよ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create requirements.txt
        run: |
          echo "janome" > requirements.txt
          echo "requests" >> requirements.txt

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run script
        run: python scripts/update_gist.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dirty/content/post/*.md
          if ! git diff --cached --exit-code; then
            git commit -m "chore: add latest gist post"
            git push
          else
            echo "変更がないので終了するね。"
          fi
