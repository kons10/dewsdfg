name: 🔄Update Submodules
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0  # 完全な履歴を取得
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔐Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: 🔄Update submodules
        run: |
          git submodule foreach 'git fetch origin && git checkout $(git config -f $toplevel/.gitmodules submodule.$name.branch || echo main) && git pull origin $(git config -f $toplevel/.gitmodules submodule.$name.branch || echo main)'
          git add .
          
      - name: 👀Check for changes
        id: check
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: ➕Create Pull Request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update submodules"
          branch: update-submodules
          title: "Update submodules"
          labels: dependencies, submodules
