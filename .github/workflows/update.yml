name: 🔄 Update Submodules (Auto Push)
on:
  workflow_dispatch: # 手動実行用
  # schedule:
  #   - cron: '0 0 * * *' # 毎日日本時間の午前9時に自動実行したいならこれを使ってね

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # プッシュするために書き込み権限が必要
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          # デフォルトのGITHUB_TOKENでOK。ただし、このプッシュをトリガーに
          # 別のWorkflowを動かしたい場合は、Personal Access Token (PAT) が必要になるよ。

      - name: 🔐 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔄 Update submodules
        run: |
          # 各サブモジュールの設定されたブランチを最新にする
          git submodule update --remote --recursive
          
      - name: 🚀 Check and Push
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "📢 アップデートが見つかったからプッシュするよ！"
            git add .
            git commit -m "🤖 chore: update submodules to latest"
            git push origin main # ここは自分のメインブランチ名に合わせてね
          else
            echo "😴 変更なし。全部最新だよ！"
          fi
