baseurl = "https://hugo.kto.f5.si"
DefaultContentLanguage = "ja"
title = "汐Official"
theme = "material"

# コードハイライト設定
[markup]
  [markup.highlight]
    # コードブロックのハイライトを有効化
    codeFences = true
    # 言語を自動推測
    guessSyntax = true
    # 行番号を表示する場合はtrueに
    lineNos = false
    # 行番号をテーブル形式で表示（コピペしやすい）
    lineNumbersInTable = false
    # CSSクラスを使用（style.cssで色をカスタマイズ可能）
    noClasses = true
    # ハイライトのスタイル（monokai, dracula, github, vs など）
    style = "monokai"
    # タブ幅
    tabWidth = 4

[Services]
  [Services.Disqus]
    # Shortname = "XXX"
  [Services.googleAnalytics]
    # id = "XXX"


[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 1
  [menu.main.params]
