baseurl = "https://hugo.kto.f5.si"
DefaultContentLanguage = "ja"
title = "Kanon's memo"
theme = "material"
copyright = "© 2026 奏音（Kanon）"
# 作者設定
[Params]
  author = "奏音（Kanon）"
  [params.giscus]
  repo = "kons10/hugo-me-wiki"
  repo_id = "R_kgDOSABtuA"
  category = "giscus"
  category_id = "DIC_kwDOSABtuM4DAPv0"
  mapping = "pathname"
  strict = "0"
  reactions_enabled = "1"
  emit_metadata = "1"
  input_position = "top"
  theme = "preferred_color_scheme"
  lang = "ja"
  loading = "lazy"
  crossorigin = "anonymous"
  async = true

# コードハイライト設定
[markup]
  [markup.highlight]
    # コードブロックのハイライトを有効化
    codeFences = true
    # 言語を自動推測
    guessSyntax = true
    # 行番号を表示する場合はtrueに
    lineNos = false
    # 行番号をテーブル形式で表示（コピペしやすい）
    lineNumbersInTable = false
    # CSSクラスを使用（style.cssで色をカスタマイズ可能）
    noClasses = true
    # ハイライトのスタイル（monokai, dracula, github, vs など）
    style = "monokai"
    # タブ幅
    tabWidth = 4

[Services]
  [Services.Disqus]
    # Shortname = "XXX"
  [Services.googleAnalytics]
    # id = "XXX"


[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 1
